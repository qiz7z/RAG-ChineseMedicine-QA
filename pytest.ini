[pytest]
; 默认只收 tests/（确定性单测基线）。
; 另两套需单独跑（无法与 tests/ 同进程收集）：
;   langchain_app/tests  —— 与 src/ 顶层模块名（eval/config）冲突，须独立进程：
;       python -m pytest langchain_app/tests
;   src/api/tests        —— 端点测试需 API 已启动并指定地址：
;       API_BASE_URL=http://127.0.0.1:8010 python -m pytest src/api/tests
; scripts/test/ 是一次性脚本（导入即执行），勿被 pytest 收集。
testpaths = tests
